{% extends "base.html" %}
{% block title %}Edit Materi<script>
(async()=>{const form=document.querySelector('form');const file=document.getElementById('file_pdf');if(!form||!file)return;form.addEventListener('submit',async e=>{if(document.getElementById('pdf_url').value)return;if(!file.files.length){e.preventDefault();alert('Pilih file PDF terlebih dahulu.');return}const f=file.files[0];if(!f.name.toLowerCase().endsWith('.pdf')){e.preventDefault();alert('Materi harus berupa PDF.');return}e.preventDefault();const btn=document.getElementById('submit_materi');btn.disabled=true;btn.textContent='Mengunggah PDF...';try{const r=await fetch('{{ url_for("admin.materi_upload_url") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal menyiapkan upload.');const up=await fetch(d.upload_url,{method:'PUT',headers:{'Content-Type':'application/pdf'},body:f});if(!up.ok)throw new Error('Upload PDF gagal.');document.getElementById('pdf_url').value=d.public_url;document.getElementById('pdf_path').value=d.path;document.getElementById('pdf_filename').value=f.name;form.submit()}catch(err){alert(err.message);btn.disabled=false;btn.textContent='Simpan Materi'}})})();
</script>{% endblock %}
{% block content %}<main class="container section"><h1>Edit Materi</h1><form method="POST" class="card-simple"><div class="field-row"><div class="field"><label>Jenjang</label><input name="jenjang" value="{{ material.jenjang }}"></div><div class="field"><label>Kelas</label><input name="kelas" value="{{ material.kelas }}"></div><div class="field"><label>Mapel</label><input name="mapel" value="{{ material.mapel }}"></div></div><div class="field"><label>Judul</label><input name="judul" value="{{ material.judul }}"></div><div class="field"><label>Ringkasan</label><input name="ringkasan" value="{{ material.ringkasan or '' }}"></div>{% if material.pdf_url %}<p class="muted">PDF saat ini: <a href="{{ material.pdf_url }}" target="_blank">{{ material.pdf_filename or 'Buka PDF' }} 📄</a></p>{% endif %}<div class="field"><label>Ganti File PDF <span class="muted">(opsional)</span></label><input type="file" id="file_pdf" type="file" accept="application/pdf,.pdf"><small class="muted">Kosongkan jika ingin tetap memakai PDF lama.</small></div><input type="hidden" name="pdf_url" id="pdf_url"><input type="hidden" name="pdf_path" id="pdf_path"><input type="hidden" name="pdf_filename" id="pdf_filename"><button id="submit_materi" class="btn btn-gold">Simpan</button></form></main><script>
(async()=>{const form=document.querySelector('form');const file=document.getElementById('file_pdf');if(!form||!file)return;form.addEventListener('submit',async e=>{if(document.getElementById('pdf_url').value)return;if(!file.files.length){e.preventDefault();alert('Pilih file PDF terlebih dahulu.');return}const f=file.files[0];if(!f.name.toLowerCase().endsWith('.pdf')){e.preventDefault();alert('Materi harus berupa PDF.');return}e.preventDefault();const btn=document.getElementById('submit_materi');btn.disabled=true;btn.textContent='Mengunggah PDF...';try{const r=await fetch('{{ url_for("admin.materi_upload_url") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal menyiapkan upload.');const up=await fetch(d.upload_url,{method:'PUT',headers:{'Content-Type':'application/pdf'},body:f});if(!up.ok)throw new Error('Upload PDF gagal.');document.getElementById('pdf_url').value=d.public_url;document.getElementById('pdf_path').value=d.path;document.getElementById('pdf_filename').value=f.name;form.submit()}catch(err){alert(err.message);btn.disabled=false;btn.textContent='Simpan Materi'}})})();
</script>{% endblock %}

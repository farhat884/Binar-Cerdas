{% extends "base.html" %}
{% block title %}Daftar Akun — Binar Cerdas{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Buat akun siswa</h2>
    <p class="sub">Setelah punya akun, kamu bisa langsung beli paket pertemuan.</p>
    <form method="POST">
      <div class="field">
        <label for="name">Nama Lengkap</label>
        <input type="text" id="name" name="name" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="phone">Nomor WhatsApp</label>
        <input type="text" id="phone" name="phone" placeholder="08xx-xxxx-xxxx" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="jenjang">Jenjang</label>
          <select id="jenjang" name="jenjang" required>
            <option value="">Pilih</option>
            <option value="SD">SD</option>
            <option value="SMP">SMP</option>
            <option value="SMA">SMA</option>
          </select>
        </div>
        <div class="field">
          <label for="kelas">Kelas</label>
          <input type="text" id="kelas" name="kelas" placeholder="cth. 6" required>
        </div>
      </div>
      <div class="field">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Daftar</button>
    </form>
    <div class="form-foot">Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk di sini</a></div>
  </div>
</div>
{% endblock %}

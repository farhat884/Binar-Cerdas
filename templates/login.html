{% extends "base.html" %}
{% block title %}Masuk — Binar Cerdas{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Selamat datang kembali</h2>
    <p class="sub">Masuk untuk lihat jadwal & sisa pertemuanmu.</p>
    <form method="POST">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Masuk</button>
    </form>
    <div class="form-foot">Belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar di sini</a></div>
  </div>
</div>
{% endblock %}

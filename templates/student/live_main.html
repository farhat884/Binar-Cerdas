{% extends "base.html" %}
{% block title %}{{ sesi.judul }} — Kelas Live{% endblock %}
{% block content %}
<div class="live-student-shell">
  <div id="live_root" data-status-url="{{ url_for('live_student.status', session_id=sesi.id) }}" data-jawab-url="{{ url_for('live_student.jawab', session_id=sesi.id) }}" data-drawing-url="{{ url_for('live_student.student_drawing', session_id=sesi.id) }}" data-durasi="{{ sesi.durasi_detik }}">
    <header class="live-student-top">
      <strong>✦ Binar Cerdas</strong><span>{{ sesi.judul }}</span>
      <div class="live-top-actions">
        <span id="student_mode">Menunggu pengajar…</span>
        <button id="fullscreen_btn" class="fullscreen-btn" title="Fullscreen">⛶</button>
      </div>
    </header>
    <main class="live-stage" id="live_stage">
      <div class="live-material" id="material_panel">
        <div id="material_empty" class="material-placeholder">Pengajar sedang menyiapkan materi…</div>
        <iframe id="material_pdf" class="material-frame" hidden></iframe>
        <img id="material_img" class="material-img" hidden>
        <div id="material_text" class="material-text" hidden></div>
        <span id="material_page_badge" class="material-page-badge" hidden></span>
        <canvas id="live_board"></canvas>

        <div class="draw-toolbar" id="draw_toolbar" hidden>
          <button id="student_draw_btn" class="btn btn-ghost btn-sm">✎ Coret</button>
          <div class="pen-size-group" id="pen_size_group" hidden>
            <button class="pen-size-btn active" data-w="2">✏️ Pensil</button>
            <button class="pen-size-btn" data-w="6">🖊️ Spidol</button>
            <button class="pen-size-btn" data-w="12">🖍️ Tebal</button>
          </div>
        </div>
        <div class="score-float">Skor: <span id="skor_lobi">0</span></div>
      </div>

      <div class="live-overlay" id="live_overlay" hidden>
        <section id="quiz_panel" class="quiz-panel" hidden>
          <div class="quiz-top"><span id="siswa_progress_text"></span><span id="timer_text"></span></div>
          <div class="live-timer-bar"><div class="live-timer-fill" id="siswa_timer_fill" style="width:100%"></div></div>
          <h2 id="siswa_pertanyaan"></h2><div class="live-choice-grid" id="siswa_pilihan_grid"></div>
          <p class="muted" id="siswa_menunggu_text" hidden>Jawaban terkirim. Tunggu pembahasan…</p>
        </section>
        <section id="result_panel" class="student-info" hidden>
          <h2 id="result_title">Pembahasan</h2>
          <p id="result_text"></p>
          <p class="muted" id="result_rank" style="margin-top:6px"></p>
          <h3 style="margin-top:14px">Papan Skor</h3>
          <div id="siswa_leaderboard"></div>
        </section>
      </div>
    </main>
  </div>
</div>
<script>
(() => {
 const root=document.getElementById('live_root'), board=document.getElementById('live_board'),ctx=board.getContext('2d');
 const statusUrl=root.dataset.statusUrl,jawabUrl=root.dataset.jawabUrl,drawingUrl=root.dataset.drawingUrl,durasi=+root.dataset.durasi||20;
 const overlay=document.getElementById('live_overlay'),qPanel=document.getElementById('quiz_panel'),resPanel=document.getElementById('result_panel');
 let drawing=[],qid=null,seen=0,answered=false,drawAllowed=false,drawOn=false,drawingActive=false,last={x:0,y:0},penW=2;
 let lastMaterialId=null,lastPage=null;

 // --- Fullscreen: pakai Fullscreen API kalau didukung browsernya (Android/desktop).
 // Kontainer #live_root sendiri sudah menutupi seluruh layar (position:fixed;inset:0)
 // jadi walau di HP yang gak dukung Fullscreen API (misalnya Safari iPhone), materi &
 // papan tulis tetap tampil penuh -- cuma address bar browsernya yang gak ikut hilang.
 const fsBtn=document.getElementById('fullscreen_btn');
 function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
 function syncFsBtn(){fsBtn.textContent=isFs()?'⛶ Keluar':'⛶ Fullscreen'}
 fsBtn.onclick=async()=>{try{if(!isFs()){await (root.requestFullscreen?.()||root.webkitRequestFullscreen?.())}else{await (document.exitFullscreen?.()||document.webkitExitFullscreen?.())}}catch(e){} setTimeout(resize,50)};
 document.addEventListener('fullscreenchange',()=>{syncFsBtn();resize()});
 document.addEventListener('webkitfullscreenchange',()=>{syncFsBtn();resize()});
 syncFsBtn();

 function resize(){const r=board.parentElement.getBoundingClientRect();board.width=r.width*devicePixelRatio;board.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);render();}
 function render(){ctx.clearRect(0,0,board.clientWidth,board.clientHeight);ctx.lineCap='round';ctx.lineJoin='round';for(const s of drawing){ctx.beginPath();ctx.lineWidth=s.w||3;ctx.moveTo(s.x1*board.clientWidth,s.y1*board.clientHeight);ctx.lineTo(s.x2*board.clientWidth,s.y2*board.clientHeight);ctx.stroke();}}
 board.addEventListener('pointerdown',e=>{if(!drawAllowed||!drawOn)return;drawingActive=true;last={x:e.offsetX/board.clientWidth,y:e.offsetY/board.clientHeight};board.setPointerCapture(e.pointerId)});
 board.addEventListener('pointermove',e=>{if(!drawingActive)return;const now={x:e.offsetX/board.clientWidth,y:e.offsetY/board.clientHeight};const st={x1:last.x,y1:last.y,x2:now.x,y2:now.y,w:penW};drawing.push(st);render();fetch(drawingUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stroke:st})});last=now});
 board.addEventListener('pointerup',()=>drawingActive=false);board.addEventListener('pointercancel',()=>drawingActive=false);
 document.getElementById('student_draw_btn').onclick=()=>{drawOn=!drawOn;document.getElementById('student_draw_btn').textContent=drawOn?'✓ Mencoret':'✎ Coret';document.getElementById('pen_size_group').hidden=!drawOn};
 document.querySelectorAll('.pen-size-btn').forEach(btn=>{btn.onclick=()=>{penW=+btn.dataset.w;document.querySelectorAll('.pen-size-btn').forEach(b=>b.classList.toggle('active',b===btn))}});

 function material(m,page){const empty=document.getElementById('material_empty'),pdf=document.getElementById('material_pdf'),img=document.getElementById('material_img'),txt=document.getElementById('material_text'),badge=document.getElementById('material_page_badge');empty.hidden=!!m;pdf.hidden=true;img.hidden=true;txt.hidden=true;badge.hidden=true;if(!m)return;
  const materialChanged=lastMaterialId!==m.id;
  if(m.pdf_url){
    pdf.hidden=false;
    // Halaman disinkron dari admin lewat fragment #page=N. Kalau materi ATAU
    // halamannya beneran berubah, src di-set ULANG DARI NOL (bukan cuma ganti
    // fragment) supaya viewer PDF bawaan browser beneran lompat halaman --
    // banyak browser (terutama di HP) mengabaikan perubahan #page kalau cuma
    // hash-nya doang yang beda dari src yang sama persis sebelumnya.
    if(materialChanged||lastPage!==page){pdf.src='';pdf.src=m.pdf_url+'#page='+(page||1)+'&t='+Date.now();lastPage=page}
    badge.hidden=false;badge.textContent='📄 Halaman '+(page||1);
  }else if(m.rangkuman_gambar_url){img.src=m.rangkuman_gambar_url;img.hidden=false}
  else{txt.textContent=m.ringkasan||m.judul||'Materi';txt.hidden=false}
  lastMaterialId=m.id;
 }
 const labels=['A','B','C','D'];
 function renderQ(q){if(qid===q.id)return;qid=q.id;seen=Date.now();answered=false;document.getElementById('siswa_menunggu_text').hidden=true;document.getElementById('siswa_pertanyaan').textContent=q.pertanyaan;const g=document.getElementById('siswa_pilihan_grid');g.innerHTML='';(q.pilihan||[]).forEach((x,i)=>{const b=document.createElement('button');b.className='live-choice-btn live-choice-'+labels[i].toLowerCase();b.textContent=labels[i]+'. '+x;b.onclick=async()=>{if(answered)return;answered=true;[...g.children].forEach(x=>x.disabled=true);await fetch(jawabUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_id:q.id,selected:labels[i],waktu_ms:Date.now()-seen})});document.getElementById('siswa_menunggu_text').hidden=false};g.appendChild(b)})}
 function renderLB(a,peringkat){document.getElementById('siswa_leaderboard').innerHTML=a.length?a.map((p,i)=>`<div class="live-leaderboard-row"><span>#${i+1} ${p.nama}</span><b>${p.skor}</b></div>`).join(''):'<span class="muted">Belum ada skor.</span>';document.getElementById('result_rank').textContent=peringkat?`Peringkat kamu saat ini: #${peringkat}`:''}
 async function poll(){try{const d=await(await fetch(statusUrl)).json();document.getElementById('student_mode').textContent=d.status==='soal'?('KUIS'+(d.active_checkpoint?': '+d.active_checkpoint:' AKTIF')):'MENGAJAR';material(d.material,d.current_page);drawing=d.drawing||[];render();drawAllowed=!!d.student_draw_enabled;board.style.pointerEvents=drawAllowed?'auto':'none';const dt=document.getElementById('draw_toolbar');dt.hidden=!drawAllowed;if(!drawAllowed){drawOn=false;document.getElementById('pen_size_group').hidden=true;document.getElementById('student_draw_btn').textContent='✎ Coret'}
 const quizAllowed=d.quiz_allowed!==false;
 // Kuis/hasil ditampilkan sebagai OVERLAY (nongol tiba-tiba di atas materi &
 // papan tulis) -- bukan panel statis di samping -- supaya kerasa interaktif
 // dan tetap kelihatan walau lagi fullscreen.
 if(d.status==='soal'&&d.soal_aktif&&quizAllowed){overlay.hidden=false;qPanel.hidden=false;resPanel.hidden=true;renderQ(d.soal_aktif);document.getElementById('siswa_progress_text').textContent=`Soal ${d.current_index+1} dari ${d.total_soal}`;document.getElementById('timer_text').textContent=(d.sisa_detik??0)+' detik';document.getElementById('siswa_timer_fill').style.width=Math.max(0,Math.min(100,(d.sisa_detik/durasi)*100))+'%';if(d.sudah_jawab){answered=true;[...document.getElementById('siswa_pilihan_grid').children].forEach(x=>x.disabled=true);document.getElementById('siswa_menunggu_text').hidden=false}}
 else if(d.status==='jeda'){overlay.hidden=false;qPanel.hidden=true;resPanel.hidden=false;document.getElementById('result_text').textContent=d.hasil_soal_ini?(d.hasil_soal_ini.jawaban_saya?.benar?'Benar! +'+d.hasil_soal_ini.jawaban_saya.skor+' poin.':'Jawaban belum tepat.'):'Menunggu soal berikutnya.';renderLB(d.leaderboard||[],d.peringkat_saya)}
 else {overlay.hidden=true;qPanel.hidden=true;resPanel.hidden=true;document.getElementById('skor_lobi').textContent=d.skor_saya||0}
 }catch(e){}}
 window.addEventListener('resize',resize);resize();poll();setInterval(poll,1000);
})();
</script>
{% endblock %}
